# parameters for training to be used for star data
Camera:  # camera specs
  baseline: 100.0
  e_per_adu: 45.0
  em_gain: 300.0
  px_size:
    - 60.0
    - 60.0
  read_sigma: 70
  spur_noise: 0.0
InOut:
  calibration_file: z-stack-3dcal.mat # path to 3d calibration
  experiment_out:  # place your path to the output folder here
Simulation:
  bg_uniform:  # background range to sample from. You can also specify a const. value as 'bg_uniform: 100'
    - 90
    - 150
  emitter_av: 50  # average number of emitters on a frame with extent as specified below, 25 is default
  emitter_extent:  # specify the extent of the emitters in x,y,z on the frame. Please be careful with '-' signs
    # X range
    - - -0.5
      - 39.5
    # Y range
    - - -0.5
      - 39.5
    # Z range
    - - -0.5
      - 0.5
  intensity_mu_sig:  # emitters brightness, mean and standard deviation
    - 10_000.0
    - 3_000.0
  lifetime_avg: 1.25  # lifetime average of the emitters
